<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BudgetFlow</title>
    <meta name="color-scheme" content="light">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-box">
        <p class="brand">Budget<span>Flow</span></p>
        <h1>Sign in to BudgetFlow</h1>
        <p class="lede">Personal accounts, transactions, budgets and monthly reports. One login per browser tab.</p>
        <div class="card">
            <h2 id="auth-title">Log in</h2>
            <form id="auth-form">
                <label for="auth-name">Name</label>
                <input id="auth-name" type="text" placeholder="Name" autocomplete="username">
                <label for="auth-password">Password</label>
                <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password">
                <p><button type="submit" id="auth-button">Log in</button></p>
            </form>
            <p class="auth-switch"><a href="#" id="auth-switch">No account? Register</a></p>
        </div>
        <p id="auth-status"></p>
    </div>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
