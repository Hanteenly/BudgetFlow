services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budgetflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - budgetflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budgetflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "6060:6060"
    environment:
      PORT: "6060"
      SPRING_DATASOURCE_HOST: db
      SPRING_DATASOURCE_PORT: "5432"
      SPRING_DATASOURCE_NAME: budgetflow
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  budgetflow_data:
